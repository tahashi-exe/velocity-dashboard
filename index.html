<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#6D28D9" />
<title>VelocityAE — Find your next run</title>

<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Prototype notice: this branch is throwaway per the mattpocock/skills
     "prototype" skill — three structural UI variants switchable below,
     nothing here is meant to merge to main as-is. -->

<!-- Landing page -->
<div id="landing-page">
  <svg class="landing-pin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 22s8-7.58 8-13A8 8 0 0 0 4 9c0 5.42 8 13 8 13z" fill="#A3E635"/>
    <circle cx="12" cy="9" r="3" fill="#4C1D95"/>
  </svg>
  <h1 class="landing-title">VelocityAE</h1>
  <p class="landing-tagline">Find your next run</p>
  <button id="lets-run-btn" class="landing-cta">Let's Run?</button>
</div>

<!-- Onboarding modal -->
<div id="onboarding-modal" class="modal-overlay" aria-hidden="true">
  <div class="modal-card">
    <div id="onboarding-steps"></div>
  </div>
</div>

<!-- Shared run detail panel (PRD.md §4.5 card hierarchy) -->
<aside id="run-panel" class="panel panel-left" aria-hidden="true">
  <button id="run-panel-close" class="panel-close" aria-label="Close">&times;</button>
  <div id="run-panel-content"></div>
</aside>

<div id="overlay" class="overlay"></div>

<!-- Each variant renders its own topbar/layout into here -->
<main id="app-root"></main>

<!-- Prototype-only: variant switcher, per prototype skill UI.md -->
<div id="variant-switcher" class="variant-switcher"></div>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="calendar.js"></script>
<script src="map-helpers.js"></script>
<script src="shared-ui.js"></script>
<script src="variant-a.js"></script>
<script src="variant-b.js"></script>
<script src="variant-c.js"></script>
<script src="switcher.js"></script>
<script>
  mountSwitcher();
  mountVariant();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>

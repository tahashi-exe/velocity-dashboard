<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velocity — Dubai Run Clubs</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">V</span>
    <span class="brand-name">Velocity</span>
  </div>
  <button id="run-now-btn" class="run-now-btn">
    <span class="run-now-dot"></span>
    Run Now
  </button>
</header>

<main id="map"></main>

<!-- Club detail panel -->
<aside id="club-panel" class="panel" aria-hidden="true">
  <button id="close-panel" class="panel-close" aria-label="Close">&times;</button>
  <div id="club-panel-content"></div>
</aside>

<!-- Run Now results panel -->
<aside id="runnow-panel" class="panel" aria-hidden="true">
  <button id="close-runnow" class="panel-close" aria-label="Close">&times;</button>
  <div id="runnow-content"></div>
</aside>

<div id="overlay" class="overlay"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>

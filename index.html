<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VelocityAE — Find your next run</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Landing page -->
<div id="landing-page">
  <svg class="landing-pin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 22s8-7.58 8-13A8 8 0 0 0 4 9c0 5.42 8 13 8 13z" fill="#A3E635"/>
    <circle cx="12" cy="9" r="3" fill="#4C1D95"/>
  </svg>
  <h1 class="landing-title">VelocityAE</h1>
  <p class="landing-tagline">Find your next run</p>
  <button id="lets-run-btn" class="landing-cta">Let's Run?</button>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">V</span>
    <span class="brand-name">Velocity</span>
  </div>
  <button id="run-now-btn" class="run-now-btn">
    <span class="run-now-dot"></span>
    Run Now
  </button>
</header>

<main id="map"></main>

<!-- Club detail panel -->
<aside id="club-panel" class="panel" aria-hidden="true">
  <button id="close-panel" class="panel-close" aria-label="Close">&times;</button>
  <div id="club-panel-content"></div>
</aside>

<!-- Run Now results panel -->
<aside id="runnow-panel" class="panel" aria-hidden="true">
  <button id="close-runnow" class="panel-close" aria-label="Close">&times;</button>
  <div id="runnow-content"></div>
</aside>

<div id="overlay" class="overlay"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>

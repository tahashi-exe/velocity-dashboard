<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VelocityAE — Find your next run</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Landing page -->
<div id="landing-page">
  <svg class="landing-pin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 22s8-7.58 8-13A8 8 0 0 0 4 9c0 5.42 8 13 8 13z" fill="#A3E635"/>
    <circle cx="12" cy="9" r="3" fill="#4C1D95"/>
  </svg>
  <h1 class="landing-title">VelocityAE</h1>
  <p class="landing-tagline">Find your next run</p>
  <button id="lets-run-btn" class="landing-cta">Let's Run?</button>
</div>

<!-- Onboarding modal -->
<div id="onboarding-modal" class="modal-overlay" aria-hidden="true">
  <div class="modal-card">
    <div id="onboarding-steps"></div>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <div class="legend-wrap">
      <button id="legend-btn" class="legend-flag-btn" aria-label="Pin color legend" aria-expanded="false">🇦🇪</button>
      <div id="legend-popover" class="legend-popover" role="tooltip">
        <div class="legend-popover-title">Pin colors</div>
        <div class="legend-popover-item"><span class="legend-dot black"></span>One-off event</div>
        <div class="legend-popover-item"><span class="legend-dot green"></span>Freebies</div>
        <div class="legend-popover-item"><span class="legend-dot red"></span>Training</div>
        <div class="legend-popover-item"><span class="legend-dot white"></span>Regular club run</div>
      </div>
    </div>
    <span class="brand-mark">V</span>
    <span class="brand-name">Velocity</span>
  </div>
  <div class="topbar-actions">
    <button id="filters-btn" class="icon-btn" aria-label="Filters">☰</button>
    <button id="run-now-btn" class="run-now-btn">
      <span class="run-now-dot"></span>
      Run Now
    </button>
    <button id="profile-btn" class="icon-btn profile-btn" aria-label="Profile">👤</button>
  </div>
</header>

<main id="map"></main>

<!-- List / Map bottom sheet -->
<section id="list-sheet" class="list-sheet">
  <div id="sheet-handle" class="sheet-handle"><span class="handle-bar"></span></div>
  <div id="this-week-banner" class="this-week-banner"></div>
  <div id="list-content" class="list-content"></div>
</section>

<!-- Club/event detail panel -->
<aside id="club-panel" class="panel panel-left" aria-hidden="true">
  <button id="close-panel" class="panel-close" aria-label="Close">&times;</button>
  <div id="club-panel-content"></div>
</aside>

<!-- Run Now results panel -->
<aside id="runnow-panel" class="panel panel-left" aria-hidden="true">
  <button id="close-runnow" class="panel-close" aria-label="Close">&times;</button>
  <div id="runnow-content"></div>
</aside>

<!-- Filters panel -->
<aside id="filters-panel" class="panel panel-right" aria-hidden="true">
  <button id="close-filters" class="panel-close" aria-label="Close">&times;</button>
  <div id="filters-content"></div>
</aside>

<div id="overlay" class="overlay"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#6D28D9" />
<title>VelocityAE — Stay on the move</title>

<link rel="manifest" href="manifest.webmanifest" />
<!-- iOS home-screen icon MUST be a PNG — Safari ignores an SVG apple-touch-icon
     and falls back to screenshotting the top of the page instead. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Landing page: live globe-to-map background, decorative + non-interactive -->
<div id="landing-page">
  <div id="landing-map"></div>
  <div class="landing-scrim"></div>
  <div class="landing-content">
    <svg class="landing-pin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 22s8-7.58 8-13A8 8 0 0 0 4 9c0 5.42 8 13 8 13z" fill="#A3E635"/>
      <circle cx="12" cy="9" r="3" fill="#4C1D95"/>
    </svg>
    <h1 class="landing-title">VelocityAE</h1>
    <p class="landing-tagline">Stay on the move</p>
    <button id="lets-run-btn" class="landing-cta">Let's Run?</button>
  </div>
</div>

<!-- Onboarding modal -->
<div id="onboarding-modal" class="modal-overlay" aria-hidden="true">
  <div class="modal-card">
    <div id="onboarding-steps"></div>
  </div>
</div>

<!-- Install-to-homescreen tutorial: platform-aware, shown after onboarding -->
<div id="install-modal" class="modal-overlay" aria-hidden="true">
  <div class="modal-card">
    <div id="install-steps"></div>
  </div>
</div>

<!-- Shared run detail panel (PRD.md §4.5 card hierarchy) -->
<aside id="run-panel" class="panel panel-left" aria-hidden="true">
  <button id="run-panel-close" class="panel-close" aria-label="Close">&times;</button>
  <div id="run-panel-content"></div>
</aside>

<div id="overlay" class="overlay"></div>

<main id="app-root"></main>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="calendar.js"></script>
<script src="map-helpers.js"></script>
<script src="landing-map.js"></script>
<script src="shared-ui.js"></script>
<script src="variant-a.js"></script>
<script>
  VariantA.mount();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
